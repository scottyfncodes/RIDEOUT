<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a2e"/>
      <stop offset="1" stop-color="#0e1a14"/>
    </linearGradient>
    <linearGradient id="slope" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b5a45"/>
      <stop offset="1" stop-color="#20362a"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6b1a"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed square: iOS applies its own rounded mask. -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <!-- Sun low over the ridge -->
  <circle cx="742" cy="282" r="92" fill="#f1ece0" opacity=".92"/>
  <!-- Back ridge -->
  <path d="M0 520 L210 360 L330 440 L520 250 L700 420 L820 350 L1024 500 L1024 1024 L0 1024 Z" fill="#2a4535" opacity=".9"/>
  <!-- Front slope -->
  <path d="M0 610 L300 420 L520 330 L1024 640 L1024 1024 L0 1024 Z" fill="url(#slope)"/>
  <!-- Topo contours on the slope -->
  <g fill="none" stroke="#f1ece0" stroke-opacity=".10" stroke-width="10" stroke-linecap="round">
    <path d="M60 690 C260 600 420 520 560 470 C700 520 860 600 1000 690"/>
    <path d="M20 790 C240 700 420 620 580 580 C740 620 900 700 1020 790"/>
    <path d="M0 900 C230 820 420 740 600 700 C760 740 920 820 1024 900"/>
  </g>
  <!-- Switchback trail: dark cut, then bright line -->
  <path d="M520 335 C560 400 700 430 690 500 C680 570 360 560 350 650 C340 740 700 740 690 830 C684 890 560 930 470 1024"
        fill="none" stroke="#0e1a14" stroke-opacity=".55" stroke-width="92" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M520 335 C560 400 700 430 690 500 C680 570 360 560 350 650 C340 740 700 740 690 830 C684 890 560 930 470 1024"
        fill="none" stroke="url(#trail)" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
