<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c23"/>
      <stop offset="1" stop-color="#111512"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb14a"/>
      <stop offset="1" stop-color="#ff6f1f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="392" cy="112" r="40" fill="#e6e1d3" opacity=".9"/>
  <path d="M0 300 L 96 196 L 150 238 L 236 140 L 318 228 L 368 190 L 512 300 L 512 512 L 0 512 Z" fill="#26392e"/>
  <path d="M236 140 L 266 172 L 252 170 L 240 184 L 226 168 L 212 168 Z" fill="#e6e1d3" opacity=".75"/>
  <path d="M0 372 L 120 300 L 210 340 L 330 290 L 512 360 L 512 512 L 0 512 Z" fill="#30493a"/>
  <!-- singletrack -->
  <path d="M-10 452 C 120 420, 300 420, 522 404 L 522 522 L -10 522 Z" fill="#17201a"/>
  <path d="M-10 452 C 120 420, 300 420, 522 404" fill="none" stroke="#c98a4a" stroke-width="5" opacity=".7"/>
  <g transform="rotate(-4 256 360)">
    <!-- wheels: knobby tires -->
    <g fill="none" stroke="#efe9db">
      <circle cx="148" cy="364" r="62" stroke-width="18"/>
      <circle cx="364" cy="364" r="62" stroke-width="18"/>
      <circle cx="148" cy="364" r="73" stroke-width="6" stroke-dasharray="3.5 7.97" stroke-opacity=".85"/>
      <circle cx="364" cy="364" r="73" stroke-width="6" stroke-dasharray="3.5 7.97" stroke-opacity=".85"/>
      <circle cx="148" cy="364" r="42" stroke-width="2.5" stroke-opacity=".35"/>
      <circle cx="364" cy="364" r="42" stroke-width="2.5" stroke-opacity=".35"/>
    </g>
    <circle cx="148" cy="364" r="9" fill="#efe9db"/>
    <circle cx="364" cy="364" r="9" fill="#efe9db"/>
    <!-- frame -->
    <g fill="none" stroke="url(#frame)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 372 L 210 270 M244 372 L 318 262 M210 278 L 316 252" stroke-width="18"/>
      <path d="M244 372 L 148 364 M148 364 L 208 300" stroke-width="12"/>
    </g>
    <!-- rear shock -->
    <path d="M222 300 L 262 288" stroke="#efe9db" stroke-width="12" stroke-linecap="round"/>
    <!-- suspension fork + head tube -->
    <path d="M316 244 L 324 272" stroke="url(#frame)" stroke-width="22" stroke-linecap="round"/>
    <path d="M326 276 L 342 322" stroke="#2b2b2b" stroke-width="15" stroke-linecap="round"/>
    <path d="M338 312 L 364 364" stroke="#d9d4c6" stroke-width="10" stroke-linecap="round"/>
    <!-- cockpit -->
    <path d="M314 242 L 318 222 L 340 214" fill="none" stroke="#2b2b2b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M326 208 L 354 220" stroke="#2b2b2b" stroke-width="12" stroke-linecap="round"/>
    <!-- dropper + saddle -->
    <path d="M210 270 L 202 240" stroke="#2b2b2b" stroke-width="10" stroke-linecap="round"/>
    <path d="M176 236 C 196 228, 216 230, 230 236" fill="none" stroke="#2b2b2b" stroke-width="13" stroke-linecap="round"/>
    <!-- drivetrain -->
    <circle cx="244" cy="372" r="20" fill="#1a1f1b" stroke="#efe9db" stroke-width="5"/>
    <path d="M244 372 L 258 398" stroke="#efe9db" stroke-width="7" stroke-linecap="round"/>
    <circle cx="148" cy="364" r="20" fill="none" stroke="#efe9db" stroke-width="3" stroke-opacity=".5"/>
  </g>
</svg>
